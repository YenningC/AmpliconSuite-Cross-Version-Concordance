name: Synthetic regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      MPLBACKEND: Agg
      CNVKIT_SMOKE_PYTHON: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install comparison package
        run: python -m pip install .
      - name: Run synthetic regression tests
        run: python -m unittest discover -s tests -v
      - name: Run public demo
        run: asbench demo --out demo_output
