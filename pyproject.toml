[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"
[project]
name = "ampliconsuite-cross-version-concordance"
version = "0.4.0"
description = "AmpliconSuite Cross-Version Concordance: assess version differences at selected regions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4", "pysam>=0.22,<0.25"]
[project.scripts]
asconcordance = "ascompare.concordance:main"
ascompare = "ascompare.__main__:main"
[tool.setuptools.packages.find]
include = ["ascompare*"]
[tool.setuptools.package-data]
ascompare = ["versions.lock.json", "official_tools.lock.json", "builtin_cnvkit_map.json"]
