[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ampliconsuite-benchmarks"
version = "0.3.0"
description = "Local, bounded AmpliconSuite cross-version benchmarks with explicit evidence scope"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4", "pysam>=0.22,<0.25"]
[project.scripts]
asbench = "ascompare.benchmark:main"
ascompare = "ascompare.__main__:main"
[tool.setuptools.packages.find]
include = ["ascompare*"]
[tool.setuptools.package-data]
ascompare = ["versions.lock.json", "official_tools.lock.json", "builtin_cnvkit_map.json"]
